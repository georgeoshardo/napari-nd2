[project]
name = "napari-nd2"
version = "0.1.0"
description = "Open Nikon ND2 files in napari, lazily, one layer per channel."
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [{ name = "Georgeos Hardo" }]
requires-python = ">=3.10"
dependencies = [
    "dask[array]",
    "nd2>=0.11",
    "numpy",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: napari",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Image Processing",
]

[project.urls]
Repository = "https://github.com/georgeoshardo/napari-nd2"
Issues = "https://github.com/georgeoshardo/napari-nd2/issues"

[project.entry-points."napari.manifest"]
napari-nd2 = "napari_nd2:napari.yaml"

[build-system]
requires = ["setuptools>=77"]  # the license expression
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
napari_nd2 = ["napari.yaml"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64"]

[tool.pixi.dependencies]
python = "3.12.*"

[tool.pixi.pypi-dependencies]
napari_nd2 = { path = ".", editable = true }

[tool.pixi.environments]
default = { features = ["dev"], solve-group = "default" }
test = { features = ["dev", "test"], solve-group = "default" }

[tool.pixi.feature.dev.dependencies]
pyqt6 = "*"

[tool.pixi.feature.dev.pypi-dependencies]
napari = ">=0.7"

[tool.pixi.feature.test.tasks]
test = "pytest"

[dependency-groups]
# napari without a Qt backend: the tests use napari's viewer model, not a window
test = [
    "napari",
    "npe2",
    "pytest",
]

[tool.ruff]
line-length = 88
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "S", "C4", "B", "A001", "RUF", "SIM105", "TID"]
ignore = ["E501", "B905", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]

[tool.typos.default.extend-words]
nd = "nd"
