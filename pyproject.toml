[project]
name = "napari-nd2"
version = "0.1.0"
description = "Lazy ND2 reader plugin for napari using the nd2 backend."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "dask[array]",
    "nd2>=0.11",
    "numpy",
]
classifiers = [
    "Framework :: napari",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: BSD License",
]

[project.entry-points."napari.manifest"]
napari-nd2 = "napari_nd2:napari.yaml"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
napari_nd2 = ["napari.yaml"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64"]

[tool.pixi.dependencies]
python = "3.12.*"

[tool.pixi.pypi-dependencies]
napari_nd2 = { path = ".", editable = true }

[tool.pixi.environments]
default = { features = ["dev"], solve-group = "default" }
test = { features = ["dev", "test"], solve-group = "default" }

[tool.pixi.feature.dev.dependencies]
pyqt6 = "*"

[tool.pixi.feature.dev.pypi-dependencies]
napari = ">=0.7"

[tool.pixi.feature.test.tasks]
test = "pytest"

[dependency-groups]
test = [
    "npe2",
    "pytest",
]

[tool.ruff]
line-length = 88
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "S", "C4", "B", "A001", "RUF", "SIM105", "TID"]
ignore = ["E501", "B905", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]

[tool.typos.default.extend-words]
nd = "nd"
